<script>

function loadTelemetry(){
fetch("http://localhost:8080/data")
.then(response => response.json())
.then(data => {

    //clear each time
    document.body.innerHTML = ""

    for(const key in data){
        document.body.innerHTML += `<p>${key}: ${data[key]}</p>`
    }


})
}
loadTelemetry()

setInterval(loadTelemetry, 1000)

</script>


</body>
</html>
